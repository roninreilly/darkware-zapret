name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test, build universal app and package
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./create_app.sh "$RELEASE_REF"
          else
            ./create_app.sh
          fi
          swift test
      - name: Verify archive checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          FLAGS=()
          if [[ "$RELEASE_REF" == *-* ]]; then FLAGS+=(--prerelease --latest=false); fi
          NOTES_PATH="docs/RELEASE-${RELEASE_REF#v}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            FLAGS+=(--notes-file "$NOTES_PATH")
          else
            FLAGS+=(--generate-notes)
          fi
          gh release create "$RELEASE_REF" dist/*.dmg dist/*.zip dist/*_Source.tar.gz dist/*.provenance.json dist/SHA256SUMS --verify-tag --title "Darkware Zapret $RELEASE_REF" "${FLAGS[@]}"
